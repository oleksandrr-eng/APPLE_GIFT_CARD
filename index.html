<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0b12">
<title>Gift Card Giveaway</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: #0b0b12; color: #fff;
  font-family: 'Fira Sans', 'Segoe UI', Roboto, Arial, sans-serif;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  padding: 16px 12px; touch-action: manipulation; user-select: none; -webkit-tap-highlight-color: transparent;
}

/* ---------- menu ---------- */
#player { position: relative; height: min(72dvh, calc((100vw - 24px) * 16 / 9)); aspect-ratio: 9 / 16;
  border-radius: 18px; overflow: hidden; background: #000; }
#vars { display: flex; gap: 8px; }
.vb { width: min(80px, calc((100vw - 60px) / 4)); height: 54px; border-radius: 14px; border: 2px solid transparent;
  background: var(--sw); color: #fff; font-family: inherit; font-weight: 800; font-size: 20px; opacity: .55; }
.vb.on { opacity: 1; border-color: #fff; }
#start { width: min(344px, 92vw); height: 60px; border: 0; border-radius: 30px; background: #fff; color: #111;
  font-family: inherit; font-weight: 900; font-size: 24px; letter-spacing: 2px; }

/* fullscreen while playing */
body.playing #vars, body.playing #start { display: none; }
body.playing #player { position: fixed; inset: 0; width: 100vw; height: 100dvh; border-radius: 0; aspect-ratio: auto; }

/* ---------- stage (sized/scaled by JS) ---------- */
#stage { position: absolute; left: 0; top: 0; overflow: hidden; transform-origin: 0 0; }
.layer { position: absolute; inset: 0; }

/* card scene */
#bg { background: radial-gradient(circle at 50% 42%, var(--bg1), var(--bg2) 45%, #07060f); }
#rays, #glow { position: absolute; left: 50%; top: 42%; border-radius: 50%; opacity: 0; }
#rays { width: 1000px; height: 1000px; margin: -500px;
  background: repeating-conic-gradient(rgba(255,255,255,.1) 0 8deg, transparent 8deg 20deg); }
#glow { width: 420px; height: 420px; margin: -210px; background: radial-gradient(circle, var(--g1), var(--g2) 45%, transparent 70%); }
#bigphone { position: absolute; left: 50%; top: 5%; width: 200px; margin-left: -100px; opacity: 0;
  filter: drop-shadow(0 18px 30px rgba(0,0,0,.6)); }

#card { position: absolute; left: 50%; top: 42%; width: 250px; height: 333px; margin: -166px 0 0 -125px; perspective: 900px; }
#inner { position: absolute; inset: 0; transform-style: preserve-3d; }
.face { position: absolute; inset: 0; border-radius: 20px; overflow: hidden; background: var(--card); color: var(--ct);
  backface-visibility: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.55); text-align: center; }
.slot { position: absolute; left: 83px; top: 14px; width: 84px; height: 16px; border-radius: 9px; background: var(--slot); }
#front .custom-image { position: absolute; left: 45px; top: 49px; width: 160px; height: 160px; object-fit: contain; }
#front h2 { position: absolute; bottom: 58px; width: 100%; font-size: 30px; font-weight: 800; }
#front p { position: absolute; bottom: 34px; width: 100%; font-size: 12px; font-weight: 600; letter-spacing: 2px; color: #888; }
#back { transform: rotateY(180deg); }
#back h3 { margin-top: 44px; font-size: 20px; font-weight: 800; }
#back p { margin-top: 6px; font-size: 11px; letter-spacing: 1.5px; color: #888; }
#strip { position: absolute; left: 18px; right: 18px; top: 108px; height: 118px; border-radius: 12px; background: #fff;
  border: 2px dashed #e1e1ea; overflow: hidden; display: flex; align-items: center; justify-content: center; }
#prize { font-size: 27px; font-weight: 900; line-height: 1.05; color: transparent; -webkit-background-clip: text; background-clip: text;
  background-image: linear-gradient(90deg, var(--p1), var(--p2), var(--p3)); }
#foil { position: absolute; inset: 0; width: 100%; height: 100%; }
.lines { position: absolute; left: 24px; right: 24px; top: 246px; }
.lines i { display: block; height: 6px; border-radius: 3px; background: #e6e6ee; margin-bottom: 9px; }
#confetti { position: absolute; inset: 0; width: 100%; height: 100%; }
#wipe { position: absolute; left: 50%; top: 42%; width: 20px; height: 20px; margin: -10px; border-radius: 50%; background: #f4f4f6; transform: scale(0); }

/* site */
#site { background: #f4f4f6; opacity: 0; color: #111; }
header { height: 64px; background: var(--acc); color: #fff; display: flex; align-items: flex-end; gap: 12px; padding: 0 16px 12px;
  font-size: 19px; font-weight: 800; }
.menu { width: 18px; height: 14px; margin-bottom: 4px; border-block: 2.5px solid #fff; background: linear-gradient(#fff,#fff) center / 100% 2.5px no-repeat; }
#grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px 14px; }
.cell { height: 138px; background: #fff; border: 2px solid var(--acc); border-radius: 14px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 700; }
.cell img { width: 92px; height: 92px; object-fit: contain; margin-bottom: 4px; }
#dim { background: rgba(0,0,0,.45); opacity: 0; }
#sheet { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 20px 40px; background: #fff; border-radius: 22px 22px 0 0; transform: translateY(110%); }
#sheet > img { display: block; width: 130px; height: 130px; margin: 0 auto; object-fit: contain; }
#sheet h3 { text-align: center; font-size: 22px; font-weight: 800; }
.lab { font-size: 11px; letter-spacing: 1px; color: #888; margin: 12px 0 7px; }
.row { display: flex; gap: 8px; }
.dot { width: 30px; height: 30px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1.5px #ccc; }
.pill { flex: 1; padding: 9px 0; border-radius: 20px; border: 1.5px solid #ccc; text-align: center; font-size: 13px; font-weight: 700; }
.dot.on { box-shadow: 0 0 0 2.5px var(--acc); }
.pill.on { background: var(--acc); border-color: var(--acc); color: #fff; }
.btn { background: var(--acc); color: #fff; text-align: center; font-weight: 800; letter-spacing: 1px; border-radius: 30px; }
#select { margin-top: 16px; padding: 13px; font-size: 16px; }
#done { background: #f4f4f6; transform: translateX(100%); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 36px 40px; }
#done img { width: 210px; height: 210px; object-fit: contain; }
#done h2 { margin-top: 10px; font-size: 28px; font-weight: 900; }
#done p { margin-top: 6px; font-size: 14px; line-height: 1.35; color: #666; }
#join { margin-top: 26px; padding: 15px 44px; font-size: 17px; }

#tap { position: absolute; width: 46px; height: 46px; margin: -23px; border-radius: 50%; opacity: 0;
  background: rgba(255,255,255,.55); border: 2.5px solid #fff; box-shadow: 0 2px 10px rgba(0,0,0,.35); }
</style>
</head>

  { sw:'#7a3cff,#ff3b6b', bg1:'#3b2a6e', bg2:'#1a1236', g1:'rgba(255,220,120,.55)', g2:'rgba(255,120,200,.15)', card:'#f7f7fa', ct:'#111', slot:'#fff',
    p:['#ff3b6b','#ff8a00','#7a3cff'], acc:'#e5202e', a:['#5b4bc4','#ff4f9a','#2fb36b','#ffd21f','#ff5a1f','#3a2ea0','#29a6e0'] },
  { sw:'#ff8a00,#c8102e', bg1:'#6e3a0a', bg2:'#2a1404', g1:'rgba(255,200,80,.6)', g2:'rgba(255,90,30,.18)', card:'#fff8ec', ct:'#2a1404', slot:'#fff',
    p:['#ffb800','#ff6a00','#d4102a'], acc:'#d4102a', a:['#c8102e','#ffb800','#ff6a00','#ffe066','#e5202e','#8a1020','#ff8a00'] },
  { sw:'#00c6ff,#0a3d91', bg1:'#0d3b6e', bg2:'#06172e', g1:'rgba(120,220,255,.55)', g2:'rgba(80,120,255,.18)', card:'#f2f7ff', ct:'#0a1f3d', slot:'#fff',
    p:['#00b4ff','#0060ff','#7a3cff'], acc:'#1667e0', a:['#0a3d91','#00c6ff','#7a3cff','#7fe3ff','#1667e0','#2b1f8f','#30d5c8'] },
  { sw:'#00e676,#0b3d2a', bg1:'#0e4a33', bg2:'#04140d', g1:'rgba(160,255,120,.5)', g2:'rgba(0,230,180,.18)', card:'#141416', ct:'#fff', slot:'#2a2a2e',
    p:['#00e676','#00d0ff','#c6ff00'], acc:'#0fa958', a:['#0b6e45','#00e676','#00b0ff','#c6ff00','#00c896','#06402a','#7cffcb'] },
];

/* ================= SETUP ================= */
const $ = id => document.getElementById(id);
const player = $('player'), stage = $('stage');
document.querySelectorAll('img.ph').forEach(img => img.src = PHONE_IMG);
$('grid').innerHTML = MODELS.map(([n, f]) => `<div class="cell"><img src="${PHONE_IMG}" style="filter:${f}" alt="">${n}</div>`).join('');
$('colors').innerHTML = COLORS.map(c => `<div class="dot" style="background:${c}"></div>`).join('');
$('storage').innerHTML = STORAGE.map(s => `<div class="pill">${s}</div>`).join('');
$('model').textContent = MODELS[0][0];
$('doneText').textContent = `Join the giveaway on our channel for a chance to win ${MODELS[0][0]}`;
const cell = $('grid').children[0], colorDot = $('colors').children[0], storagePill = $('storage').lastElementChild;

$('vars').innerHTML = THEMES.map((t, i) => `<button class="vb" style="--sw:linear-gradient(135deg,${t.sw})">${i + 1}</button>`).join('');
const varButtons = [...$('vars').children];

/* ================= HELPERS ================= */
const clamp = x => Math.min(1, Math.max(0, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));          // 0..1 between a and b
const easeOut = x => 1 - (1 - x) ** 3;
const easeInOut = x => x < .5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2;
const backOut = x => 1 + 2.7 * (x - 1) ** 3 + 1.7 * (x - 1) ** 2;
let scale = 1;
function center(el) {                                           // element center in stage coords
  const r = el.getBoundingClientRect(), s = stage.getBoundingClientRect();
  return [(r.left - s.left + r.width / 2) / scale, (r.top - s.top + r.height / 2) / scale];
}

/* ================= SCRATCH FOIL ================= */
const foil = $('foil').getContext('2d');
const zigzag = Array.from({ length: 10 }, (_, i) => [i % 2 ? .96 : .04, .08 + i * .093]);
function pointOnPath(u) {
  const f = u * (zigzag.length - 1), i = Math.min(zigzag.length - 2, Math.floor(f)), k = f - i;
  const [a, b] = [zigzag[i], zigzag[i + 1]];
  return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
}
function drawFoil(u) {
  foil.globalCompositeOperation = 'source-over';
  const g = foil.createLinearGradient(0, 0, 642, 342);
  g.addColorStop(0, '#b9bcc6'); g.addColorStop(.5, '#e9ebf0'); g.addColorStop(1, '#9fa3ae');
  foil.fillStyle = g; foil.fillRect(0, 0, 642, 342);
  foil.fillStyle = 'rgba(90,94,106,.9)'; foil.font = '800 44px Fira Sans, Arial'; foil.textAlign = 'center';
  foil.fillText('SCRATCH HERE', 321, 188);
  if (u <= 0) return;
  foil.globalCompositeOperation = 'destination-out';
  foil.lineWidth = 120; foil.lineCap = foil.lineJoin = 'round';
  foil.beginPath();
  for (let j = 0; j <= 200 * u; j++) { const [x, y] = pointOnPath(j / 200); foil[j ? 'lineTo' : 'moveTo'](x * 642, y * 342); }
  foil.stroke();
}

/* ================= CONFETTI ================= */
const conf = $('confetti'), cx = conf.getContext('2d');
let seed = 11; const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
const pieces = Array.from({ length: 140 }, (_, i) => {
  const a = rnd() * Math.PI * 2, v = 600 + rnd() * 1500;
  return { vx: Math.cos(a) * v, vy: Math.sin(a) * v - 900, w: 14 + rnd() * 16, h: 8 + rnd() * 10, r: rnd() * 6, vr: (rnd() - .5) * 14,
           c: ['#ff3b6b','#ffd21f','#2fb36b','#29a6e0','#ff8a00','#a66bff','#fff'][i % 7] };
});
function drawConfetti(t) {
  cx.clearRect(0, 0, conf.width, conf.height);
  if (t <= 0 || t > 3) return;
  cx.globalAlpha = clamp(3 - t);
  for (const q of pieces) {
    cx.save();
    cx.translate(conf.width / 2 + q.vx * t * .6, conf.height * .42 + q.vy * t * .6 + 900 * t * t);
    cx.rotate(q.r + q.vr * t); cx.fillStyle = q.c; cx.fillRect(-q.w / 2, -q.h / 2, q.w, q.h);
    cx.restore();
  }
}

/* ================= TAP INDICATOR ================= */
const tapEl = $('tap');
function showTap([x, y], alpha, pressed) {
  tapEl.style.left = x + 'px'; tapEl.style.top = y + 'px';
  tapEl.style.opacity = alpha; tapEl.style.transform = `scale(${pressed ? .78 : 1})`;
}
// finger moves from `from` to `to` during [a, a+.25], presses at [a+.25, a+.4]
function tapStep(t, a, from, to) {
  const k = easeOut(prog(t, a, a + .25));
  return { pos: [from[0] + (to[0] - from[0]) * k, from[1] + (to[1] - from[1]) * k], pressed: t > a + .25 && t < a + .4 };
}

/* ================= TIMELINE ================= */
function render(t) {
  // 1) card pops in, flips
  const pop = t < .55 ? .25 + .75 * backOut(prog(t, 0, .55)) : 1;
  const f = prog(t, .9, 1.6), arc = Math.sin(Math.PI * f);
  $('inner').style.transform = `translateY(${-20 * arc}px) scale(${pop + .12 * arc}) rotateY(${180 * easeInOut(f)}deg) rotateZ(${-12 * (1 - prog(t, 0, .55))}deg)`;

  // 2) scratch
  const s = easeInOut(prog(t, 1.85, 3.55));
  drawFoil(s);
  $('foil').style.opacity = 1 - prog(t, 3.55, 3.8);
  $('prize').style.transform = `scale(${1 + .12 * Math.sin(Math.PI * prog(t, 3.6, 4))})`;

  // 3) reveal: phone, rays, confetti
  const rv = prog(t, 3.65, 4.2), out = 1 - prog(t, 4.9, 5.4), ph = prog(t, 3.8, 4.3);
  $('glow').style.opacity = (.2 + .8 * rv) * out;
  $('rays').style.opacity = rv * out;
  $('rays').style.transform = `rotate(${t * 18}deg)`;
  $('bigphone').style.opacity = easeOut(prog(t, 3.8, 4.2));
  $('bigphone').style.transform = `translateY(${(1 - backOut(ph)) * 120 - 6 * Math.sin(t * 4)}px) scale(${.4 + .6 * backOut(ph)})`;
  $('card').style.transform = `translateY(${easeOut(ph) * 120}px) scale(${1 - .25 * easeOut(ph)})`;
  drawConfetti(t - 3.65);

  // 4) wipe to site
  $('wipe').style.transform = `scale(${easeInOut(prog(t, 4.9, 5.4)) * 120})`;
  $('site').style.opacity = prog(t, 5.1, 5.4);

  // 5) site: pick model -> sheet -> color -> storage -> select -> done
  const sheet = easeOut(prog(t, 6, 6.3));
  $('sheet').style.transform = `translateY(${(1 - sheet) * 110}%)`;
  $('dim').style.opacity = sheet;
  colorDot.classList.toggle('on', t > 6.75);
  storagePill.classList.toggle('on', t > 7.25);
  $('done').style.transform = `translateX(${(1 - easeOut(prog(t, 7.85, 8.25))) * 100}%)`;
  $('done').querySelector('img').style.transform = `scale(${.7 + .3 * backOut(prog(t, 8, 8.5))})`;

  const C = center(cell), D = center(colorDot), P = center(storagePill), S = center($('select')), J = center($('join'));
  let step = null, alpha = 1;
  if (t >= 1.75 && t < 3.7) {                                   // finger scratching
    const r = $('strip').getBoundingClientRect(), st = stage.getBoundingClientRect(), [u, v] = pointOnPath(s);
    step = { pos: [(r.left - st.left + u * r.width) / scale, (r.top - st.top + v * r.height) / scale], pressed: true };
    alpha = prog(t, 1.75, 1.85) * (1 - prog(t, 3.55, 3.7));
  }
  else if (t >= 5.55 && t < 6.15) { step = tapStep(t, 5.6, [C[0] + 40, C[1] + 80], C); alpha = 1 - prog(t, 6.05, 6.15); }
  else if (t >= 6.45 && t < 6.95) step = tapStep(t, 6.45, [D[0] + 60, D[1] + 60], D);
  else if (t >= 6.95 && t < 7.45) step = tapStep(t, 6.95, D, P);
  else if (t >= 7.45 && t < 8.0)  { step = tapStep(t, 7.45, P, S); alpha = 1 - prog(t, 7.9, 8); }
  else if (t >= 8.6)              step = tapStep(t, 8.65, [J[0] + 50, J[1] + 90], J);
  showTap(step ? step.pos : [0, 0], step ? alpha : 0, step && step.pressed);

  cell.style.transform = `scale(${t > 5.85 && t < 6.05 ? .95 : 1})`;
  $('select').style.transform = `scale(${t > 7.7 && t < 7.85 ? .95 : 1})`;
  $('join').style.transform = `scale(${t > 8.9 && t < 9.05 ? .94 : 1 + .04 * Math.sin(t * 8)})`;
}

/* ================= LAYOUT / THEME / PLAYBACK ================= */
function fit() {
  const W = player.clientWidth, H = player.clientHeight;
  scale = Math.min(W / 360, H / 640) * ZOOM;
  stage.style.width = W / scale + 'px';
  stage.style.height = H / scale + 'px';
  stage.style.transform = `scale(${scale})`;
  conf.height = Math.round(1080 * H / W);
}
function setTheme(i) {
  const th = THEMES[i];
  for (const k of ['bg1','bg2','g1','g2','card','ct','slot','acc']) player.style.setProperty('--' + k, th[k]);
  th.p.forEach((c, j) => player.style.setProperty('--p' + (j + 1), c));
  th.a.forEach((c, j) => player.style.setProperty('--a' + j, c));
  varButtons.forEach((b, j) => b.classList.toggle('on', j === i));
}

let playing = false, startTime = 0, now = .6;
function loop(ts) {
  if (!playing) return;
  now = ((ts - startTime) / 1000) % DURATION;
  render(now);
  requestAnimationFrame(loop);
}
function play() {
  const el = document.documentElement, fs = el.requestFullscreen || el.webkitRequestFullscreen;
  if (fs) Promise.resolve(fs.call(el)).catch(() => {});
  document.body.classList.add('playing');
  fit();
  playing = true; startTime = performance.now();
  requestAnimationFrame(loop);
}
function stop() {
  if (!playing) return;
  playing = false;
  document.body.classList.remove('playing');
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else if (document.webkitFullscreenElement) document.webkitExitFullscreen();
  requestAnimationFrame(() => { fit(); render(now = .6); });
}

varButtons.forEach((b, i) => b.onclick = () => { setTheme(i); render(now = .6); });
$('start').onclick = play;
player.onclick = stop;                                            // tap the video to go back
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) stop(); });
addEventListener('resize', () => { fit(); render(now); });

setTheme(0); fit();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { fit(); render(now); });
</script>
</body>
</html>
